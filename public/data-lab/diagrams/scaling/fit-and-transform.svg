<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img"><title>Fit scaling parameters on training rows and reuse them for validation</title><rect width="360" height="360" fill="white"/><g font-family="system-ui,sans-serif" fill="#172033"><text x="180" y="28" text-anchor="middle" font-size="20">train: [3, 2, 4, 1]</text><rect x="20" y="46" width="320" height="100" rx="8" fill="#eff6ff" stroke="#1d4ed8"/><text x="180" y="78" text-anchor="middle" font-size="20">μ = 2.5; ddof = 0</text><text x="180" y="115" text-anchor="middle" font-size="20">σ = √1.25 ≈ 1.118</text><path d="M180 155V189m-7-8 7 8 7-8" stroke="#172033" stroke-width="2" fill="none"/><text x="180" y="220" text-anchor="middle" font-size="20">validation: x = 3</text><rect x="20" y="239" width="320" height="98" rx="8" fill="#fff7ed" stroke="#9a3412"/><text x="180" y="273" text-anchor="middle" font-size="20">(x − μ) / σ</text><text x="180" y="312" text-anchor="middle" font-size="20">(3 − 2.5) / √1.25 ≈ 0.447</text></g></svg>
