<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" role="img"><title>Inputs and parameters produce prediction 10; target 9 enters only the residual</title><rect width="360" height="442" fill="#fff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><g font-family="system-ui,sans-serif" fill="#172033"><text x="180" y="27" font-size="17" text-anchor="middle">x = [2, 3]</text><text x="180" y="54" font-size="17" text-anchor="middle">w = [4, -1]</text><path d="M104 66V90" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><path d="M264 66V90" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><rect x="14" y="98" width="160" height="42" rx="6" fill="#eff6ff" stroke="#334155"/><text x="94" y="125" font-size="17" text-anchor="middle">2 × 4 = 8</text><rect x="188" y="98" width="158" height="42" rx="6" fill="#eff6ff" stroke="#334155"/><text x="267" y="125" font-size="17" text-anchor="middle">3 × (-1) = -3</text><path d="M94 147V166H180V187" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><path d="M267 147V166H180" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><rect x="92" y="195" width="176" height="42" rx="6" fill="#eff6ff" stroke="#334155"/><text x="180" y="222" font-size="17" text-anchor="middle">8 + (-3) = 5</text><path d="M180 244V285" fill="none" stroke="#334155" stroke-width="2"  marker-end="url(#arrow)"/><text x="252" y="268" font-size="17" text-anchor="middle">+ b = +5</text><rect x="92" y="293" width="176" height="42" rx="6" fill="#ecfdf5" stroke="#334155"/><text x="180" y="320" font-size="17" text-anchor="middle">ŷ = 10</text><path d="M180 340V384" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="14" y="345" width="85" height="42" rx="6" fill="#fff7ed" stroke="#334155"/><text x="56.5" y="372" font-size="17" text-anchor="middle">y = 9</text><path d="M99 366H117V407H138" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="146" y="386" width="198" height="42" rx="6" fill="#fff7ed" stroke="#334155"/><text x="245" y="413" font-size="17" text-anchor="middle">r = 10 − 9 = 1</text></g></svg>
