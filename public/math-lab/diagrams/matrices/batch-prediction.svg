<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" role="img"><title>One output per sample row using shared weights and bias</title><rect width="360" height="444" fill="white"/><g font-family="system-ui,sans-serif" fill="#172033"><text x="180" y="30" text-anchor="middle" font-size="18">Xw + b = ŷ</text><text x="180" y="64" text-anchor="middle" font-size="18">w = [4, -1], b = 5</text><rect x="12" y="94" width="336" height="126" rx="8" fill="#eff6ff" stroke="#334155"/><text x="43" y="121" text-anchor="middle" font-size="18">#1</text><text x="213" y="121" text-anchor="middle" font-size="18">x = [2, 3]</text><text x="180" y="156" text-anchor="middle" font-size="18">2 × (4) + 3 × (-1) + 5</text><text x="180" y="195" text-anchor="middle" font-size="18">(8) + (-3) + 5 = 10</text><rect x="12" y="238" width="336" height="126" rx="8" fill="#fff7ed" stroke="#334155"/><text x="43" y="265" text-anchor="middle" font-size="18">#2</text><text x="213" y="265" text-anchor="middle" font-size="18">x = [1, 4]</text><text x="180" y="300" text-anchor="middle" font-size="18">1 × (4) + 4 × (-1) + 5</text><text x="180" y="339" text-anchor="middle" font-size="18">(4) + (-4) + 5 = 5</text><path d="M180 375V394m-6-7 6 7 6-7" stroke="#334155" stroke-width="2" fill="none"/><text x="180" y="425" text-anchor="middle" font-size="18">ŷ = [10, 5]</text></g></svg>
