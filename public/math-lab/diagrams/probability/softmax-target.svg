<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" role="img"><title>Three exact logits, their softmax probabilities, and target negative log loss</title><rect width="360" height="374" fill="white"/><g fill="#172033" font-family="system-ui,sans-serif"><text x="180" y="28" text-anchor="middle" font-size="20">softmax(z); T = 1</text><text x="180" y="64" text-anchor="middle" font-size="20">C0: 1.5 → 0.714</text><rect x="30" y="75" width="300" height="26" rx="4" fill="#e2e8f0"/><rect x="30" y="75" width="214.06353840662067" height="26" rx="4" fill="#1d4ed8"/><text x="180" y="138" text-anchor="middle" font-size="20">C1: 0.3 → 0.215</text><rect x="30" y="149" width="300" height="26" rx="4" fill="#e2e8f0"/><rect x="30" y="149" width="64.47469874951952" height="26" rx="4" fill="#1d4ed8"/><text x="180" y="212" text-anchor="middle" font-size="20">C2: -0.8 → 0.072</text><rect x="30" y="223" width="300" height="26" rx="4" fill="#e2e8f0"/><rect x="30" y="223" width="21.46176284385978" height="26" rx="4" fill="#9a3412"/><rect x="24" y="186" width="312" height="70" rx="6" stroke="#9a3412" fill="none" stroke-dasharray="5 4"/><text x="180" y="294" text-anchor="middle" font-size="20">target = C2</text><text x="180" y="327" text-anchor="middle" font-size="20">q = 0.072</text><text x="180" y="361" text-anchor="middle" font-size="20">−ln(q) ≈ 2.638</text></g></svg>
