<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" role="img"><title>Same signal rates, different priors: posterior 37.3% versus 6.5%</title><defs><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#dbeafe"/><path d="M0 8L8 0" stroke="#1e40af"/></pattern></defs><rect width="360" height="382" fill="white"/><g font-family="system-ui,sans-serif" fill="#172033"><text x="180" y="28" text-anchor="middle" font-size="17">P(B | A) = 0.82</text><text x="180" y="55" text-anchor="middle" font-size="17">P(B | ¬A) = 0.12</text><text x="180" y="98" text-anchor="middle" font-size="17">P(A) = 8.0%</text><rect x="24" y="112" width="312" height="30" fill="url(#stripes)" stroke="#334155"/><rect x="24" y="112" width="116.29090909090908" height="30" fill="#9a3412"/><text x="180" y="172" text-anchor="middle" font-size="17">656 / 1760 ≈ 37.3%</text><text x="180" y="240" text-anchor="middle" font-size="17">P(A) = 1.0%</text><rect x="24" y="254" width="312" height="30" fill="url(#stripes)" stroke="#334155"/><rect x="24" y="254" width="20.144881889763774" height="30" fill="#9a3412"/><text x="180" y="314" text-anchor="middle" font-size="17">82 / 1270 ≈ 6.5%</text><rect x="70" y="345" width="16" height="16" fill="#9a3412"/><text x="113" y="359" text-anchor="middle" font-size="15">A</text><rect x="220" y="345" width="16" height="16" fill="url(#stripes)"/><text x="267" y="359" text-anchor="middle" font-size="15">¬A</text></g></svg>
