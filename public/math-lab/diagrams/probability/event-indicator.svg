<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" role="img"><title>An event indicator maps outcomes to zero or one</title><rect width="360" height="252" fill="white"/><g fill="#172033" font-family="system-ui,sans-serif"><text x="180" y="30" text-anchor="middle" font-size="20">A = {on time}</text><rect x="20" y="55" width="320" height="76" rx="8" fill="#eff6ff" stroke="#1d4ed8"/><text x="180" y="85" text-anchor="middle" font-size="20">A → Z = 1</text><text x="180" y="116" text-anchor="middle" font-size="20">P(Z = 1) = 0.70</text><rect x="20" y="150" width="320" height="76" rx="8" fill="#fff7ed" stroke="#9a3412"/><text x="180" y="180" text-anchor="middle" font-size="20">not A → Z = 0</text><text x="180" y="211" text-anchor="middle" font-size="20">P(Z = 0) = 0.30</text></g></svg>
