<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img"><title>A probability distribution assigns mass to each possible outcome</title><rect width="360" height="230" fill="white"/><g fill="#172033" font-family="system-ui,sans-serif"><text x="180" y="30" text-anchor="middle" font-size="20">Z ∈ {0, 1}</text><text x="180" y="72" text-anchor="middle" font-size="20">P(Z = 0) = 0.30</text><rect x="30" y="84" width="300" height="26" rx="4" fill="#e2e8f0"/><rect x="30" y="84" width="90.00000000000001" height="26" rx="4" fill="#9a3412"/><text x="180" y="145" text-anchor="middle" font-size="20">P(Z = 1) = 0.70</text><rect x="30" y="157" width="300" height="26" rx="4" fill="#e2e8f0"/><rect x="30" y="157" width="210" height="26" rx="4" fill="#1d4ed8"/><text x="180" y="218" text-anchor="middle" font-size="20">0.30 + 0.70 = 1</text></g></svg>
