<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img"><title>Equal means do not imply equal variances</title><rect width="360" height="390" fill="white"/><g fill="#172033" font-family="system-ui,sans-serif"><text x="180" y="24" text-anchor="middle" font-size="20">P(1) = P(3) = 0.5</text><path d="M40 112L320 112" fill="none" stroke="#172033" stroke-width="2"/><path d="M180 59L180 122" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/><circle cx="110" cy="112" r="10" fill="#1d4ed8"/><circle cx="250" cy="112" r="10" fill="#1d4ed8"/><text x="40" y="146" text-anchor="middle" font-size="20">0</text><text x="110" y="146" text-anchor="middle" font-size="20">1</text><text x="180" y="146" text-anchor="middle" font-size="20">2</text><text x="250" y="146" text-anchor="middle" font-size="20">3</text><text x="320" y="146" text-anchor="middle" font-size="20">4</text><text x="180" y="178" text-anchor="middle" font-size="20">E[X] = 2; Var(X) = 1</text><text x="180" y="212" text-anchor="middle" font-size="20">P(0) = P(4) = 0.5</text><path d="M40 300L320 300" fill="none" stroke="#172033" stroke-width="2"/><path d="M180 247L180 310" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/><circle cx="40" cy="300" r="10" fill="#9a3412"/><circle cx="320" cy="300" r="10" fill="#9a3412"/><text x="40" y="334" text-anchor="middle" font-size="20">0</text><text x="110" y="334" text-anchor="middle" font-size="20">1</text><text x="180" y="334" text-anchor="middle" font-size="20">2</text><text x="250" y="334" text-anchor="middle" font-size="20">3</text><text x="320" y="334" text-anchor="middle" font-size="20">4</text><text x="180" y="366" text-anchor="middle" font-size="20">E[X] = 2; Var(X) = 4</text></g></svg>
