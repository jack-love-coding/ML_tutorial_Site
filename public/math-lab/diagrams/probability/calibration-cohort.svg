<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" role="img"><title>Ten hypothetical predictions at confidence 0.90, six correct</title><rect width="360" height="390" fill="white"/><g fill="#172033" font-family="system-ui,sans-serif"><text x="180" y="26" text-anchor="middle" font-size="20">n = 10; 6 / 10 = 0.60</text><path d="M55 300L295 300" fill="none" stroke="#172033" stroke-width="2"/><path d="M55 300L55 60" fill="none" stroke="#172033" stroke-width="2"/><path d="M55 300L295 60" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/><path d="M271 300L271 156" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/><path d="M55 156L271 156" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="5 4"/><text x="55" y="327" text-anchor="middle" font-size="20">0</text><text x="27" y="307" text-anchor="middle" font-size="20">0</text><text x="175" y="327" text-anchor="middle" font-size="20">0.5</text><text x="27" y="187" text-anchor="middle" font-size="20">0.5</text><text x="295" y="327" text-anchor="middle" font-size="20">1</text><text x="27" y="67" text-anchor="middle" font-size="20">1</text><circle cx="271" cy="156" r="8" fill="#9a3412"/><text x="180" y="118" text-anchor="middle" font-size="20">(0.90, 0.60)</text><text x="180" y="356" text-anchor="middle" font-size="20">x: confidence; y: accuracy</text><text x="180" y="382" text-anchor="middle" font-size="20">ideal: y = x</text></g></svg>
