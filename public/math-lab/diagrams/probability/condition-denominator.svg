<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" role="img"><title>Filter to signal B before dividing: 656 out of 1760</title><defs><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#dbeafe"/><path d="M0 8L8 0" stroke="#1e40af"/></pattern></defs><rect width="360" height="382" fill="white"/><g font-family="system-ui,sans-serif" fill="#172033"><text x="180" y="30" text-anchor="middle" font-size="17">N = 10000</text><rect x="14" y="60" width="158" height="44" rx="6" fill="#eff6ff" stroke="#334155"/><text x="93" y="88" text-anchor="middle" font-size="17">A: 800</text><rect x="188" y="60" width="158" height="44" rx="6" fill="#fff7ed" stroke="#334155"/><text x="267" y="88" text-anchor="middle" font-size="17">¬A: 9200</text><path d="M93 110V177m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><path d="M267 110V177m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><text x="139" y="148" text-anchor="middle" font-size="15">× 0.82</text><text x="313" y="148" text-anchor="middle" font-size="15">× 0.12</text><rect x="14" y="188" width="158" height="44" rx="6" fill="#eff6ff" stroke="#334155"/><text x="93" y="216" text-anchor="middle" font-size="17">A ∩ B: 656</text><rect x="188" y="188" width="158" height="44" rx="6" fill="#fff7ed" stroke="#334155"/><text x="267" y="216" text-anchor="middle" font-size="17">¬A ∩ B: 1104</text><text x="180" y="268" text-anchor="middle" font-size="17">B: 656 + 1104 = 1760</text><path d="M180 278V300m-5-6 5 6 5-6" fill="none" stroke="#334155" stroke-width="2"/><text x="180" y="328" text-anchor="middle" font-size="17">P(A | B) = 656 / 1760</text><text x="180" y="360" text-anchor="middle" font-size="17">≈ 37.3%</text></g></svg>
